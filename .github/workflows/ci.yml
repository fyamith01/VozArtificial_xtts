name: CI - Integración Continua

on:
  pull_request:
    branches:
      - main          # PRs hacia main
      - develop       # PRs hacia develop
      - release/**    # PRs hacia cualquier rama release
      - feature/**    # PRs hacia cualquier rama feature (opcional)
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    name: Pruebas con Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']  # Tu versión actual

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar importaciones básicas
        run: |
          python -c "import torch; import TTS; import numpy; import scipy; print('Todas las librerías importadas correctamente')"

      - name: Ejecutar linter (flake8)
        run: |
          pip install flake8
          flake8 src/ --max-line-length=100

      - name: Verificar sintaxis de notebooks
        run: |
          pip install nbconvert
          for notebook in notebooks/*.ipynb; do
            jupyter nbconvert --to script "$notebook" --stdout > /dev/null && echo "✓ $notebook válido" || echo "X $notebook inválido"
          done